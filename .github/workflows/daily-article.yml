name: Daily AI Article Generator

on:
  schedule:
    # Runs at 14:00 UTC, which is 19:00 Tashkent time (UTC+5)
    - cron: '0 14 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  generate-article:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Need write permission to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate AI Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run generate
        
      - name: Generate OG Images
        run: npm run og
        continue-on-error: true # Don't fail if OG script fails
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          git commit -m "chore: auto-generate daily AI article" || exit 0
          git push


      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node tools/notify_telegram.mjs
